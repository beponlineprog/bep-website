<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.E.P. Member Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f8fc;color:#222;line-height:1.6}
header{background:#073b78;color:white;padding:15px 20px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 8px #0002}
.nav-container{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{font-size:22px;font-weight:bold;color:white;text-decoration:none}
.logo span{color:#d4af37}
nav{display:flex;gap:18px;flex-wrap:wrap}
nav a{color:white;text-decoration:none;font-weight:bold;font-size:14px}
nav a:hover{color:#d4af37}

.hero{background:linear-gradient(135deg,#073b78,#0b5aa5);color:white;text-align:center;padding:55px 20px}
.hero h1{font-size:34px;margin-bottom:10px}
.hero p{font-size:17px}

.container{width:92%;max-width:900px;margin:35px auto}
.card{background:white;border-radius:14px;padding:28px;margin-bottom:25px;box-shadow:0 5px 18px #00000014}
.card h2{color:#073b78;margin-bottom:20px;font-size:24px}
.card h2 i{color:#d4af37;margin-right:8px}

.form-group{margin-bottom:18px}
label{display:block;margin-bottom:7px;font-weight:bold;color:#333}
input{width:100%;padding:13px 14px;border:1px solid #ccd6e0;border-radius:8px;font-size:16px;outline:none}
input:focus{border-color:#073b78;box-shadow:0 0 0 2px #073b7814}

button{width:100%;border:0;border-radius:8px;padding:14px 18px;font-size:16px;font-weight:bold;cursor:pointer;transition:.2s}
button:disabled{opacity:.6;cursor:not-allowed}
.primary-btn{background:#073b78;color:white}
.primary-btn:hover{background:#052d5d}
.secondary-btn{background:#d4af37;color:#111;margin-top:12px}
.secondary-btn:hover{background:#c49f2f}

.edit-btn{background:#073b78;color:white;margin-top:15px}
.edit-btn:hover{background:#052d5d}

.cancel-btn{background:#eef2f6;color:#073b78;margin-top:12px}
.cancel-btn:hover{background:#dfe7ef}

.whatsapp-btn{display:inline-block;width:100%;text-align:center;background:#25D366;color:white;padding:13px 18px;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:15px}

.message{display:none;padding:15px;border-radius:8px;margin-bottom:20px;font-weight:500}
.success{display:block;background:#e8f7ed;color:#176b36;border:1px solid #a9dfba}
.error{display:block;background:#fdecec;color:#a12222;border:1px solid #efb0b0}
.info{display:block;background:#eaf3fb;color:#174f7c;border:1px solid #b8d6ec}

.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.profile-item{background:#f7f9fc;border-left:4px solid #d4af37;padding:15px;border-radius:7px}
.profile-label{display:block;font-size:13px;color:#666;margin-bottom:4px;font-weight:bold}
.profile-value{display:block;color:#073b78;font-size:16px;font-weight:bold;word-break:break-word}
.member-number{font-size:22px}

.status{display:inline-block;background:#e8f7ed;color:#176b36;padding:5px 12px;border-radius:20px;font-size:14px}

.portal-intro{text-align:center;margin-bottom:25px}
.portal-intro i{font-size:50px;color:#d4af37;margin-bottom:10px}
.portal-intro h2{margin-bottom:5px}

.small-text{font-size:13px;color:#666;margin-top:10px}
.link-row{text-align:center;margin-top:18px}
.link-row a{color:#073b78;font-weight:bold;text-decoration:none}
.link-row a:hover{color:#d4af37}

.edit-note{
  background:#fff8df;
  border:1px solid #ead48a;
  color:#6b5710;
  padding:12px 14px;
  border-radius:8px;
  margin-bottom:18px;
  font-size:14px;
}

.loading{text-align:center;padding:20px}
.loading i{font-size:30px;color:#073b78;margin-bottom:10px}

footer{background:#073b78;color:white;margin-top:50px;padding:40px 20px 20px}
.footer-container{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:30px}
.footer-column h3{color:#d4af37;margin-bottom:14px;font-size:18px}
.footer-column p,.footer-column a{color:#e8eef5;font-size:14px;text-decoration:none;display:block;margin-bottom:8px}
.footer-column a:hover{color:#d4af37}
.social-icons{display:flex;gap:12px;margin-top:12px}
.social-icons a{display:flex;align-items:center;justify-content:center;width:38px;height:38px;background:#ffffff1a;border-radius:50%;color:white}
.footer-bottom{max-width:1100px;margin:30px auto 0;padding-top:20px;border-top:1px solid #ffffff33;text-align:center;font-size:13px;color:#dbe5ef}

#loginSection,#forgotSection,#passwordSection,#loadingSection,#profileSection,#editProfileSection{display:none}

@media(max-width:750px){
.nav-container{flex-direction:column}
nav{justify-content:center}
.hero h1{font-size:28px}
.profile-grid{grid-template-columns:1fr}
.footer-container{grid-template-columns:1fr 1fr}
}

@media(max-width:480px){
.card{padding:20px}
.footer-container{grid-template-columns:1fr}
.hero{padding:40px 15px}
.hero h1{font-size:25px}
}
</style>
</head>
