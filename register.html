<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.E.P. Member Registration</title>

<meta name="description"
content="Register as a member of the Biblical Empowerment Program - B.E.P.">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --blue:#063b78;
    --dark-blue:#032653;
    --gold:#d4a017;
    --light:#f4f7fb;
    --white:#ffffff;
    --text:#263445;
    --muted:#667085;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--light);
    color:var(--text);
    line-height:1.6;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:92%;
    max-width:1150px;
    margin:auto;
}

/* NAVIGATION */

.navbar{
    background:var(--dark-blue);
    color:white;
    padding:15px 0;
}

.nav-content{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:23px;
    font-weight:bold;
    color:var(--gold);
}

.nav-links{
    display:flex;
    gap:22px;
    align-items:center;
}

.nav-links a{
    color:white;
    font-size:14px;
    font-weight:600;
}

.nav-links a:hover{
    color:var(--gold);
}

/* PAGE HEADER */

.page-header{
    background:linear-gradient(135deg,var(--blue),var(--dark-blue));
    color:white;
    text-align:center;
    padding:55px 15px;
    border-bottom:5px solid var(--gold);
}

.page-header h1{
    font-size:32px;
    margin-bottom:10px;
}

.page-header p{
    font-size:15px;
    opacity:.95;
}

/* REGISTRATION */

.registration-section{
    padding:45px 0;
}

.registration-card{
    background:white;
    max-width:750px;
    margin:auto;
    padding:30px;
    border-radius:14px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.section-title{
    color:var(--blue);
    font-size:25px;
    margin-bottom:8px;
    text-align:center;
}

.section-description{
    color:var(--muted);
    text-align:center;
    margin-bottom:25px;
    font-size:14px;
}

.gold-line{
    width:65px;
    height:4px;
    background:var(--gold);
    margin:12px auto 22px;
    border-radius:5px;
}

/* FORM */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-weight:600;
    margin-bottom:7px;
    color:var(--dark-blue);
    font-size:14px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:13px;
    border:1px solid #d5dce5;
    border-radius:7px;
    font-size:15px;
    background:white;
    outline:none;
}

.form-group input:focus,
.form-group select:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(6,59,120,.10);
}

.submit-btn{
    width:100%;
    border:none;
    padding:15px;
    background:var(--blue);
    color:white;
    border-radius:7px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.submit-btn:hover{
    background:var(--dark-blue);
}

.submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:15px;
    margin-top:20px;
    border-radius:7px;
    text-align:center;
    font-weight:600;
    overflow-wrap:anywhere;
}

.success{
    background:#e8f7ed;
    color:#176534;
    border:1px solid #a8dfb8;
}

.error{
    background:#fff0f0;
    color:#a32121;
    border:1px solid #f1b7b7;
}

/* CONTACT */

.contact-section{
    padding:45px 0;
    background:#eaf0f7;
}

.contact-title{
    text-align:center;
    color:var(--blue);
    font-size:27px;
    margin-bottom:25px;
}

.contact-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.contact-card{
    background:white;
    padding:22px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.contact-card i{
    font-size:27px;
    color:var(--gold);
    margin-bottom:10px;
}

.contact-card h3{
    color:var(--blue);
    margin-bottom:6px;
}

.contact-card p{
    color:var(--muted);
    font-size:14px;
}

.contact-btn{
    display:inline-block;
    margin-top:12px;
    background:var(--blue);
    color:white;
    padding:10px 16px;
    border-radius:6px;
    font-size:14px;
    font-weight:bold;
}

/* FOOTER */

footer{
    background:var(--dark-blue);
    color:white;
    padding:40px 0 18px;
}

.footer-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:25px;
}

.footer-column h3{
    color:var(--gold);
    margin-bottom:15px;
    font-size:17px;
}

.footer-column p,
.footer-column a{
    color:#e0e8f3;
    font-size:13px;
    display:block;
    margin-bottom:9px;
}

.footer-column a:hover{
    color:var(--gold);
}

.footer-bottom{
    border-top:1px solid rgba(255,255,255,.2);
    margin-top:30px;
    padding-top:18px;
    text-align:center;
    font-size:12px;
    color:#d0d9e6;
}

/* BACK TO TOP */

.back-top{
    position:fixed;
    right:18px;
    bottom:18px;
    background:var(--gold);
    color:var(--dark-blue);
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

/* MOBILE */

@media(max-width:750px){

    .nav-content{
        flex-direction:column;
    }

    .nav-links{
        flex-wrap:wrap;
        justify-content:center;
        gap:13px;
    }

    .page-header h1{
        font-size:26px;
    }

    .registration-card{
        padding:22px 17px;
    }

    .contact-grid{
        grid-template-columns:1fr;
    }

    .footer-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:420px){

    .footer-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="container nav-content">

        <a href="index.html" class="logo">
            <i class="fas fa-cross"></i> B.E.P.
        </a>

        <div class="nav-links">

            <a href="index.html">
                <i class="fas fa-home"></i> Home
            </a>

            <a href="index.html#about">
                About Us
            </a>

            <a href="index.html#contact">
                Contact
            </a>

            <a href="register.html">
                Register
            </a>

        </div>
    </div>
</nav>

<!-- PAGE HEADER -->

<header class="page-header">

    <h1>
        <i class="fas fa-user-plus"></i>
        Member Registration
    </h1>

    <p>Join the Biblical Empowerment Program</p>

    <p>Building the Church of Christ</p>

</header>

<!-- REGISTRATION SECTION -->

<section class="registration-section">

    <div class="container">

        <div class="registration-card">

            <h2 class="section-title">
                Become a B.E.P. Member
            </h2>

            <div class="gold-line"></div>

            <p class="section-description">
                Complete the registration form below.
                Your unique B.E.P. Member Number will be
                generated automatically.
            </p>
