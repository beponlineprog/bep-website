<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>B.E.P. Firebase Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 30px 15px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,.1);
    }

    h1 {
      color: #063b78;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #063b78;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f1f5f9;
      border-radius: 8px;
      word-break: break-word;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>B.E.P. Firebase Test</h1>

  <p>
    This is a temporary Firebase Authentication diagnostic.
    It does not access your B.E.P. member profile.
  </p>

  <label>Email</label>

  <input
    id="email"
    type="email"
    value="njabulo.rikh@gmail.com"
  >

  <label>Password</label>

  <input
    id="password"
    type="password"
    placeholder="Enter the password"
  >

  <button id="testButton">
    Test Firebase Login
  </button>

  <div id="result">
    Waiting for test...
  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
  }
    from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


  /*
    TEMPORARY TEST CONFIGURATION

    This uses the NEW Google Cloud API key.
  */

  const firebaseConfig = {

    apiKey:
      "AIzaSyAn-zNZFuOurJyv5WJvCilUKsEkrhF7DJs",

    authDomain:
      "beponlineprog-8b8bb.firebaseapp.com",

    projectId:
      "beponlineprog-8b8bb",

    storageBucket:
      "beponlineprog-8b8bb.firebasestorage.app",

    messagingSenderId:
      "312026634976",

    appId:
      "1:312026634976:web:5497f071e8f0e6618fce85"

  };


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const result =
    document.getElementById("result");


  const button =
    document.getElementById("testButton");


  button.addEventListener("click", async () => {

    const email =
      document.getElementById("email")
        .value
        .trim();

    const password =
      document.getElementById("password")
        .value;


    result.innerHTML =
      "Testing Firebase Authentication...";


    button.disabled = true;


    try {

      const credential =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        credential.user;


      result.innerHTML = `
        <strong>SUCCESS</strong><br><br>

        Firebase Authentication accepted the API key
        and successfully authenticated the account.<br><br>

        UID:<br>
        ${user.uid}<br><br>

        Email:<br>
        ${user.email}<br><br>

        Email verified:<br>
        ${user.emailVerified}
      `;


      await signOut(auth);


    } catch (error) {

      console.error(error);


      result.innerHTML = `
        <strong>FIREBASE ERROR</strong><br><br>

        Code:<br>
        ${error.code || "unknown"}<br><br>

        Message:<br>
        ${error.message || "No message"}
      `;

    } finally {

      button.disabled = false;

    }

  });

</script>

</body>
</html>
