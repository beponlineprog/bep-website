<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.E.P. Bible Quiz | Biblical Empowerment Program</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f8fc;
    color:#1f2937;
    line-height:1.6;
}

/* =========================
   NAVIGATION
========================= */

nav{
    background:linear-gradient(135deg,#003b73,#0066b3);
    color:white;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 12px rgba(0,0,0,0.18);
}

.nav-container{
    max-width:1200px;
    margin:auto;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:bold;
    white-space:nowrap;
}

.logo span{
    color:#ffd700;
}

.nav-links{
    display:flex;
    gap:8px;
    align-items:center;
}

.nav-links a{
    color:white;
    text-decoration:none;
    padding:9px 11px;
    border-radius:7px;
    font-size:14px;
    transition:0.3s;
}

.nav-links a:hover,
.nav-links a.active{
    background:rgba(255,255,255,0.18);
}

.nav-links i{
    margin-right:5px;
}

.menu-btn{
    display:none;
    font-size:25px;
    cursor:pointer;
}

/* =========================
   PAGE HEADER
========================= */

.page-header{
    background:linear-gradient(135deg,#003b73,#0077c8);
    color:white;
    text-align:center;
    padding:55px 20px;
}

.page-header h1{
    font-size:38px;
    margin-bottom:10px;
}

.page-header p{
    font-size:18px;
    max-width:700px;
    margin:auto;
}

.quiz-badge{
    display:inline-block;
    margin-top:18px;
    background:#ffd700;
    color:#003b73;
    padding:8px 18px;
    border-radius:30px;
    font-weight:bold;
}

/* =========================
   MAIN
========================= */

.container{
    max-width:1000px;
    margin:40px auto;
    padding:0 20px;
}

.info-card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    margin-bottom:25px;
}

.info-card h2{
    color:#003b73;
    margin-bottom:12px;
}

.quiz-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:20px;
}

.info-box{
    background:#eef6ff;
    border-left:5px solid #0066b3;
    padding:15px;
    border-radius:8px;
    text-align:center;
}

.info-box strong{
    display:block;
    color:#003b73;
    font-size:22px;
}

/* =========================
   MEMBER DETAILS
========================= */

.member-card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    margin-bottom:25px;
}

.member-card h2{
    color:#003b73;
    margin-bottom:18px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.form-group input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:16px;
}

.form-group input:focus{
    outline:none;
    border-color:#0066b3;
    box-shadow:0 0 0 2px rgba(0,102,179,0.12);
}

/* =========================
   QUESTIONS
========================= */

.question-card{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:15px;
    box-shadow:0 5px 18px rgba(0,0,0,0.07);
    border-left:5px solid #0066b3;
}

.question-number{
    color:#0066b3;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

.question-card h3{
    font-size:18px;
    color:#172554;
    margin-bottom:17px;
}

.option{
    display:block;
    background:#f8fafc;
    border:1px solid #dbe4ee;
    padding:12px 14px;
    margin:9px 0;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
}

.option:hover{
    background:#eef6ff;
    border-color:#0066b3;
}

.option input{
    margin-right:10px;
}

/* =========================
   SUBMIT
========================= */

.submit-container{
    text-align:center;
    margin:35px 0;
}

.submit-btn{
    border:none;
    background:linear-gradient(135deg,#003b73,#0066b3);
    color:white;
    padding:15px 35px;
    border-radius:30px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.submit-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 18px rgba(0,0,0,0.2);
}

/* =========================
   RESULT
========================= */

#result{
    display:none;
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    margin:30px 0;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

#result h2{
    color:#003b73;
    margin-bottom:12px;
}

.score{
    font-size:38px;
    font-weight:bold;
    color:#0066b3;
    margin:10px 0;
}

.pass{
    color:#16803c;
    font-size:22px;
    font-weight:bold;
}

.fail{
    color:#c62828;
    font-size:22px;
    font-weight:bold;
}

.result-message{
    margin-top:10px;
}

/* =========================
   CONTACT
========================= */

.contact-section{
    background:#eaf4ff;
    padding:50px 20px;
    margin-top:50px;
}

.contact-container{
    max-width:1100px;
    margin:auto;
}

.contact-title{
    text-align:center;
    color:#003b73;
    font-size:30px;
    margin-bottom:10px;
}

.contact-subtitle{
    text-align:center;
    margin-bottom:30px;
}

.contact-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.contact-card{
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.07);
}

.contact-card i{
    font-size:30px;
    color:#0066b3;
    margin-bottom:10px;
}

.contact-card h3{
    color:#003b73;
    margin-bottom:8px;
}

.contact-card p{
    margin-bottom:15px;
}

.contact-btn{
    display:inline-block;
    text-decoration:none;
    background:#0066b3;
    color:white;
    padding:10px 18px;
    border-radius:25px;
    font-weight:bold;
    margin:4px;
    transition:0.3s;
}

.contact-btn:hover{
    background:#003b73;
}

.whatsapp{
    background:#16803c;
}

.whatsapp:hover{
    background:#0d632c;
}

.facebook{
    background:#1877f2;
}

.email{
    background:#6b4fbb;
}

.teams{
    background:#4f46e5;
}

/* =========================
   FOOTER
========================= */

footer{
    background:#002b52;
    color:white;
    padding:45px 20px 20px;
}

.footer-container{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:30px;
}

.footer-column h3{
    color:#ffd700;
    margin-bottom:15px;
}

.footer-column p{
    color:#dbeafe;
    margin-bottom:8px;
}

.footer-column a{
    display:block;
    color:#dbeafe;
    text-decoration:none;
    margin:7px 0;
}

.footer-column a:hover{
    color:#ffd700;
}

.footer-bottom{
    border-top:1px solid rgba(255,255,255,0.15);
    text-align:center;
    margin-top:30px;
    padding-top:20px;
    color:#cbd5e1;
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){

    .menu-btn{
        display:block;
    }

    .nav-links{
        display:none;
        position:absolute;
        top:59px;
        left:0;
        width:100%;
        background:#003b73;
        flex-direction:column;
        padding:12px;
    }

    .nav-links.show{
        display:flex;
    }

    .nav-links a{
        width:100%;
        text-align:left;
        padding:12px;
    }

    .page-header h1{
        font-size:30px;
    }

    .quiz-info{
        grid-template-columns:1fr;
    }

    .contact-grid{
        grid-template-columns:1fr;
    }

    .footer-container{
        grid-template-columns:1fr;
        text-align:center;
    }

    .footer-column a{
        margin:10px 0;
    }
}

</style>
</head>

<body>

<!-- =========================
     NAVIGATION
========================= -->

<nav>

<div class="nav-container">

<div class="logo">
B.E.P. <span>✦</span>
</div>

<div class="menu
